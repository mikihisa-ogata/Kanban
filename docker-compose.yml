# bff と frontend をまとめて起動する（bff だけなら bff/docker-compose.yml を使う）
services:
  bff:
    build: ./bff
    ports:
      - "8080:8080"
    volumes:
      - ./bff/todos.csv:/app/todos.csv
      - ./bff/epics.csv:/app/epics.csv
      - ./bff/spaces.csv:/app/spaces.csv
    restart: always

  frontend:
    build: ./frontend
    # API の呼び出し先はブラウザから見た http://localhost:8080 のため、ポートは変えない
    ports:
      - "3000:3000"
    depends_on:
      - bff
    restart: always
